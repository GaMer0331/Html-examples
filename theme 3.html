<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Personal Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Dinamik fon: Har safar yangi tabiat manzarasi */
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://picsum.photos/1920/1080?nature');
            background-size: cover;
            background-position: center;
            color: white;
            overflow: hidden;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 50px 80px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease;
        }

        .glass-container:hover {
            transform: scale(1.02);
        }

        #clock {
            font-size: 6rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        #date {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .search-box {
            margin-top: 20px;
        }

        .search-box input {
            padding: 12px 25px;
            width: 300px;
            border-radius: 25px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.3);
            width: 350px;
        }

        .quick-links {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .link-item {
            text-decoration: none;
            color: white;
            font-size: 0.9rem;
            padding: 10px 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div id="date">Yuklanmoqda...</div>
        <div id="clock">00:00</div>
        
        <form class="search-box" action="https://www.google.com/search" method="GET">
            <input type="text" name="q" placeholder="Google bo'ylab qidiruv..." autocomplete="off">
        </form>

        <div class="quick-links">
            <a href="https://github.com" class="link-item">GitHub</a>
            <a href="https://youtube.com" class="link-item">YouTube</a>
            <a href="https://gemini.google.com" class="link-item">AI Chat</a>
            <a href="https://instagram.com" class="link-item">Instagram</a>
        </div>
    </div>

    <script>
        function updateDashboard() {
            const now = new Date();
            
            // Soatni yangilash
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;
            
            // Sanani yangilash
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('uz-UZ', options);
        }

        // Har soniyada yangilab turish
        setInterval(updateDashboard, 1000);
        updateDashboard();

        // Fon rasmini har 1 soatda avtomatik o'zgartirish (ixtiyoriy)
        setInterval(() => {
            document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://picsum.photos/1920/1080?nature&sig=${Math.random()}')`;
        }, 3600000);
    </script>
</body>
</html>
